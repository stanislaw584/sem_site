name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            SITE_NAME="sem-student-site"

            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx rsync
            fi

            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown -R "${USER}:${USER}" "$DEPLOY_PATH"

            if [ -d /etc/nginx/sites-available ] && [ -d /etc/nginx/sites-enabled ]; then
              sudo tee "/etc/nginx/sites-available/$SITE_NAME" >/dev/null <<EOF
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;

                root $DEPLOY_PATH;
                index index.html;

                location / {
                    try_files \$uri \$uri/ /index.html;
                }
            }
            EOF
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo ln -sf "/etc/nginx/sites-available/$SITE_NAME" "/etc/nginx/sites-enabled/$SITE_NAME"
            else
              sudo tee "/etc/nginx/conf.d/$SITE_NAME.conf" >/dev/null <<EOF
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;

                root $DEPLOY_PATH;
                index index.html;

                location / {
                    try_files \$uri \$uri/ /index.html;
                }
            }
            EOF
            fi

      - name: Upload dist to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          SOURCE: dist/
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: -rlgoDzvc --delete

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t
              sudo systemctl reload nginx
            fi
